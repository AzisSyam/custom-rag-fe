<h1 class="text-2xl font-headline-md font-bold text-on-surface mb-8 text-center tracking-tight">Welcome Back</h1>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5">
<!-- Email Field -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-4 text-on-surface-variant pointer-events-none" data-icon="mail">mail</span>
<input class="m3-input peer w-full h-[56px] bg-transparent text-on-surface border border-outline rounded-DEFAULT pl-12 pr-4 focus:border-primary focus:border-2 focus:ring-0 transition-colors" id="email" placeholder=" " required="" type="email"/>
<label class="m3-label absolute left-12 top-4 text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="email">Email</label>
</div>
<!-- Password Field -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-4 text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="m3-input peer w-full h-[56px] bg-transparent text-on-surface border border-outline rounded-DEFAULT pl-12 pr-12 focus:border-primary focus:border-2 focus:ring-0 transition-colors" id="password" placeholder=" " required="" type="password"/>
<label class="m3-label absolute left-12 top-4 text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-3 top-4 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="w-full flex justify-end mt-[-8px]">
<a class="text-sm font-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors font-medium px-2 py-1 rounded-DEFAULT hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" href="#">Forgot Password?</a>

<div class="mt-8 text-sm font-body-md text-on-surface-variant">
