<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DocuMind AI - Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed-variant": "#354a4f", "surface-container-low": "#eef5f7", tertiary: "#545d7e", "secondary-fixed": "#d0e6ec", "primary-container": "#0ac4e0", background: "#f4fafc", "inverse-primary": "#3cd8f5", outline: "#6c797d", "outline-variant": "#bbc9cd", "on-background": "#161d1e", "on-error": "#ffffff", "on-secondary-fixed": "#091e23", "on-primary": "#ffffff", "surface-bright": "#f4fafc", surface: "#f4fafc", "on-tertiary": "#ffffff", "on-surface-variant": "#3c494c", "inverse-on-surface": "#ecf2f4", "surface-tint": "#006878", secondary: "#4d6267", "on-tertiary-fixed-variant": "#3c4665", "tertiary-fixed": "#dbe1ff", "tertiary-fixed-dim": "#bcc5eb", "tertiary-container": "#a8b1d6", "surface-variant": "#dde4e5", "on-error-container": "#93000a", "on-secondary-container": "#51666b", "on-primary-fixed-variant": "#004e5b", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "inverse-surface": "#2b3133", "secondary-fixed-dim": "#b4cad0", "primary-fixed-dim": "#3cd8f5", "on-tertiary-fixed": "#101a37", "surface-dim": "#d5dbdd", "on-surface": "#161d1e", "secondary-container": "#cde4e9", "surface-container-high": "#e3e9eb", "primary-fixed": "#a6eeff", "on-primary-container": "#004c58", primary: "#006878", "surface-container": "#e9eff1", "error-container": "#ffdad6", "surface-container-highest": "#dde4e5", "on-tertiary-container": "#3b4463", "on-primary-fixed": "#001f25", error: "#ba1a1a" }, borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" }, spacing: { "margin-mobile": "16px", base: "4px", lg: "24px", gutter: "16px", xs: "4px", xl: "32px", md: "16px", sm: "8px", "margin-desktop": "24px" }, fontFamily: { "label-lg": ["Roboto"], "title-md": ["Roboto"], "body-lg": ["Roboto"], "body-md": ["Roboto"], "display-lg": ["Roboto"], "headline-lg": ["Roboto"], "label-sm": ["Roboto"], "title-lg": ["Roboto"], "headline-md": ["Roboto"], headline: ["Roboto"], display: ["Roboto"], body: ["Roboto"], label: ["Roboto"] }, fontSize: { "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500" }], "title-md": ["16px", { lineHeight: "24px", letterSpacing: "0.15px", fontWeight: "500" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0.5px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0.25px", fontWeight: "400" }], "display-lg": ["57px", { lineHeight: "64px", letterSpacing: "-0.25px", fontWeight: "400" }], "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "0px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }], "title-lg": ["22px", { lineHeight: "28px", letterSpacing: "0px", fontWeight: "400" }], "headline-md": ["28px", { lineHeight: "36px", letterSpacing: "0px", fontWeight: "400" }] } } } };</script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface rounded-xl shadow-md border border-surface-variant p-8 flex flex-col gap-6">
        <!-- Header -->
        <div class="flex flex-col items-center text-center gap-4">
            <img alt="DocuMind AI Logo" class="w-16 h-16 rounded-md object-cover shadow-sm"
                data-alt="Minimalist and modern logo for 'DocuMind AI'. A combination of a stylized document icon and a brain or digital spark, symbolizing intelligent document Q&amp;A. Use the primary cyan primary-container from the design system. Clean lines, professional, suitable for a high-tech AI application set in a bright light mode environment."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_D-d0It9dxs0hFPk0fMi4Y_OziIHVXua_lFSZBr4pJxVB7NmSH1XFrEyuYuQa9kipGeEHvkec1xXUZlKVWn7RLZajcgWxvQ0FMzus-GVApH8yJI-YmNan9brOXaasi5NruloOCNBA3wg-e-uv4DH2NMBsAwUMUSs1aZvl03bXvG8nmXdoI_JKxEAU5ECPsky_eGGt_z1a5DuVncwngsgCO_QF-YPY67BcftPRCb5GFkVT8YkeWz9guR7v_TQVY1nJ5TBIlJQKYoqD" />
            <div>
                <h1 class="text-headline-md font-bold text-on-surface">Create Account</h1>
                <p class="text-body-md text-on-surface-variant mt-1">Join DocuMind AI to start analyzing documents.</p>
            </div>
        </div>
        <!-- Form -->
        <form class="flex flex-col gap-4">
            <!-- Name Field -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-xl">person</span>
                </div>
                <input
                    class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors"
                    id="name" name="name" placeholder="Full Name" type="text" />
            </div>
            <!-- Email Field (Error State Example) -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-error text-xl">mail</span>
                </div>
                <input aria-describedby="email-error" aria-invalid="true"
                    class="block w-full pl-10 pr-10 py-3 border border-error rounded-lg bg-surface text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-error focus:border-error sm:text-sm transition-colors"
                    id="email" name="email" placeholder="Email Address" type="email" value="invalid-email" />
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-error text-xl">error</span>
                </div>
            </div>
            <p class="mt-1 text-sm text-error font-body" id="email-error">Please enter a valid email address.</p>
            <!-- Password Field -->
            <div class="relative mt-2">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-xl">lock</span>
                </div>
                <input
                    class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors"
                    id="password" name="password" placeholder="Password" type="password" />
            </div>
            <!-- Confirm Password Field -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-xl">lock_reset</span>
                </div>
                <input
                    class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors"
                    id="confirm_password" name="confirm_password" placeholder="Confirm Password" type="password" />
            </div>
            <!-- Submit Button -->
            <button
                class="mt-4 w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-label-lg text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                type="submit">
                Create Account
            </button>
        </form>
        <!-- Footer Links -->
        <div class="text-center mt-2">
            <p class="text-body-md text-on-surface-variant">
                Already have an account?
                <a class="font-medium text-primary hover:text-primary-fixed-variant transition-colors" href="#">Log
                    In</a>
            </p>
        </div>
    </div>
</body>

</html>
